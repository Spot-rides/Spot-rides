$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.com/schemas/requirement.schema.yaml"

title: Requirement
description: Product requirements for a feature.
type: object

required:
  - id
  - type
  - version
  - status
  - title
  - goal
  - acceptance_criteria

properties:

  id:
    type: string
    pattern: "^FEAT-[0-9]{3,}$"

  type:
    type: string
    const: requirement

  version:
    type: integer
    minimum: 1

  status:
    type: string
    enum:
      - draft
      - ready
      - approved
      - blocked
      - cancelled

  title:
    type: string
    minLength: 1

  summary:
    type: string

  goal:
    type: string
    minLength: 1

  problem:
    type: string

  users:
    type: array
    items:
      type: object
      required:
        - role
      properties:
        role:
          type: string
        description:
          type: string

  user_stories:
    type: array
    items:
      type: object
      required:
        - id
        - statement
      properties:
        id:
          type: string
        statement:
          type: string
        priority:
          type: string
          enum:
            - must
            - should
            - could

  functional_requirements:
    type: array
    items:
      type: object
      required:
        - id
        - description
      properties:
        id:
          type: string
        description:
          type: string
        priority:
          type: string
          enum:
            - must
            - should
            - could

  acceptance_criteria:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - description
        - verification
      properties:
        id:
          type: string
        description:
          type: string
        verification:
          type: string
        priority:
          type: string
          enum:
            - must
            - should
            - could

  non_goals:
    type: array
    items:
      type: string

  constraints:
    type: array
    items:
      type: string

  dependencies:
    type: array
    items:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        type:
          type: string
        required:
          type: boolean

  assumptions:
    type: array
    items:
      type: string

  open_questions:
    type: array
    items:
      type: object
      required:
        - id
        - question
      properties:
        id:
          type: string
        question:
          type: string
        blocking:
          type: boolean

  success_metrics:
    type: array
    items:
      type: object
      required:
        - metric
      properties:
        metric:
          type: string
        target:
          type: string

  priority:
    type: string
    enum:
      - critical
      - high
      - medium
      - low

  owner:
    type: string