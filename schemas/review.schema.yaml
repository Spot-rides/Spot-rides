$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.com/schemas/review.schema.yaml"

title: Code Review
description: Independent implementation review.
type: object

required:
  - id
  - type
  - feature_id
  - reviewer
  - status
  - findings

properties:

  id:
    type: string
    pattern: "^REVIEW-[0-9]{3,}$"

  type:
    type: string
    const: code-review

  feature_id:
    type: string
    pattern: "^FEAT-[0-9]{3,}$"

  reviewer:
    type: string
    const: code-reviewer

  status:
    type: string
    enum:
      - approved
      - changes_requested
      - blocked

  requirements_status:
    type: string
    enum:
      - pass
      - fail
      - unknown

  architecture_status:
    type: string
    enum:
      - pass
      - fail
      - unknown

  testing_status:
    type: string
    enum:
      - pass
      - fail
      - unknown

  findings:
    type: array
    items:
      type: object
      required:
        - id
        - severity
        - title
        - description
      properties:

        id:
          type: string

        severity:
          type: string
          enum:
            - blocker
            - high
            - medium
            - low
            - nit

        title:
          type: string

        description:
          type: string

        location:
          type: string

        recommendation:
          type: string

        blocking:
          type: boolean

        resolved:
          type: boolean

  positives:
    type: array
    items:
      type: string

  scope_assessment:
    type: string