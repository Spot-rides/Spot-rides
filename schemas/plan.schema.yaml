$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.com/schemas/plan.schema.yaml"

title: Implementation Plan
description: Dependency-aware engineering plan for a feature.
type: object

required:
  - id
  - type
  - feature_id
  - architecture_id
  - version
  - status
  - tasks

properties:

  id:
    type: string
    pattern: "^PLAN-[0-9]{3,}$"

  type:
    type: string
    const: plan

  feature_id:
    type: string
    pattern: "^FEAT-[0-9]{3,}$"

  architecture_id:
    type: string
    pattern: "^ARCH-[0-9]{3,}$"

  version:
    type: integer
    minimum: 1

  status:
    type: string
    enum:
      - draft
      - ready
      - approved
      - blocked

  tasks:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - title
        - owner
        - status
      properties:

        id:
          type: string
          pattern: "^TASK-[0-9]{3,}$"

        title:
          type: string

        description:
          type: string

        owner:
          type: string
          enum:
            - frontend-engineer
            - backend-engineer
            - test-engineer
            - architect
            - product-manager
            - code-reviewer
            - security-reviewer

        status:
          type: string
          enum:
            - pending
            - ready
            - in_progress
            - blocked
            - complete
            - skipped

        dependencies:
          type: array
          items:
            type: string
            pattern: "^TASK-[0-9]{3,}$"

        affected_files:
          type: array
          items:
            type: string

        acceptance_criteria:
          type: array
          items:
            type: string

        tests_required:
          type: array
          items:
            type: string

        risk:
          type: string
          enum:
            - critical
            - high
            - medium
            - low

        parallel_group:
          type: string

  critical_path:
    type: array
    items:
      type: string

  parallel_groups:
    type: array
    items:
      type: object
      required:
        - id
        - tasks
      properties:
        id:
          type: string
        tasks:
          type: array
          items:
            type: string

  rollout:
    type: object
    properties:
      order:
        type: array
        items:
          type: string
      feature_flag:
        type: boolean
      migration:
        type: boolean
      rollback:
        type: string