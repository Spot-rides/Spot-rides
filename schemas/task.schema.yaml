$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.com/schemas/task.schema.yaml"

title: Task
description: Atomic implementation task.
type: object

required:
  - id
  - type
  - feature_id
  - plan_id
  - title
  - owner
  - status

properties:

  id:
    type: string
    pattern: "^TASK-[0-9]{3,}$"

  type:
    type: string
    const: task

  feature_id:
    type: string
    pattern: "^FEAT-[0-9]{3,}$"

  plan_id:
    type: string
    pattern: "^PLAN-[0-9]{3,}$"

  title:
    type: string
    minLength: 1

  owner:
    type: string

  status:
    type: string
    enum:
      - pending
      - ready
      - in_progress
      - blocked
      - complete
      - skipped

  priority:
    type: string
    enum:
      - critical
      - high
      - medium
      - low

  dependencies:
    type: array
    items:
      type: string
      pattern: "^TASK-[0-9]{3,}$"

  affected_files:
    type: array
    items:
      type: string

  goal:
    type: string

  context:
    type: string

  implementation_notes:
    type: array
    items:
      type: string

  acceptance_criteria:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - description
      properties:
        id:
          type: string
        description:
          type: string
        verified:
          type: boolean

  tests_required:
    type: array
    items:
      type: object
      required:
        - type
        - description
      properties:
        type:
          type: string
          enum:
            - unit
            - integration
            - contract
            - e2e
            - regression
            - security
            - manual
        description:
          type: string

  risk:
    type: string
    enum:
      - critical
      - high
      - medium
      - low

  blockers:
    type: array
    items:
      type: string

  verification:
    type: object
    properties:
      commands:
        type: array
        items:
          type: string
      result:
        type: string
        enum:
          - not_run
          - passed
          - failed
          - environment_failure