openapi: 3.0.3
info:
  title: Spot Rides — Auth API (accounts)
  description: |
    OTP-based phone authentication endpoints for the Spot Rides platform.

    ## Authentication flow
    1. `POST /api/auth/otp/request/` — send a 6-digit OTP to the phone via SMS.
    2. `POST /api/auth/otp/verify/` — submit the code to receive JWT access + refresh tokens.
    3. Attach the access token as `Authorization: Bearer <access>` on protected endpoints.
    4. `POST /api/auth/token/refresh/` — get a fresh access token before it expires.
    5. `POST /api/auth/logout/` — blacklist the refresh token to sign out.

    ## Error envelope
    All error responses share a single JSON shape:
    ```json
    { "error": "<code>", "detail": "<human message>", "retry_after"?: <int> }
    ```
    `retry_after` (seconds) is included only on `429` responses and the
    `Retry-After` HTTP header is also set on those responses.
  version: 1.0.0
  contact:
    name: Spot Rides Engineering

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.spotrides.com
    description: Production

tags:
  - name: OTP Authentication
    description: Passwordless sign-in via SMS one-time password
  - name: JWT Tokens
    description: Token refresh and session termination
  - name: User
    description: Authenticated user profile
  - name: Health
    description: Service liveness probe

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained from `POST /api/auth/otp/verify/`.
        Payload custom claim: `phone_number` (E.164 string).

  # -------------------------------------------------------------------------
  # Reusable schemas
  # -------------------------------------------------------------------------
  schemas:

    # -- Error envelope -------------------------------------------------------
    ErrorEnvelope:
      type: object
      required: [error, detail]
      properties:
        error:
          type: string
          description: Machine-readable error code (stable across releases)
          example: invalid_phone_number
        detail:
          type: string
          description: Human-readable description of the error
          example: Phone number is not a valid E.164 number.
        retry_after:
          type: integer
          description: Seconds until the caller may retry (429 responses only)
          example: 30

    # -- Request bodies -------------------------------------------------------
    OtpRequestBody:
      type: object
      required: [phone_number]
      properties:
        phone_number:
          type: string
          maxLength: 32
          description: |
            Phone number in any parseable format (national, international, E.164).
            Normalised to E.164 internally. Must belong to an allowed country.
          example: "+12125551234"

    OtpVerifyBody:
      type: object
      required: [phone_number, code]
      properties:
        phone_number:
          type: string
          maxLength: 32
          description: Same phone number used in the preceding otp/request call
          example: "+12125551234"
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^\\d{6}$"
          description: 6-digit OTP received via SMS
          example: "123456"

    LogoutBody:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
          description: JWT refresh token to blacklist
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoicmVmcmVzaCJ9.sig"

    TokenRefreshBody:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
          description: Valid JWT refresh token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoicmVmcmVzaCJ9.sig"

    # -- Response bodies ------------------------------------------------------
    OtpRequestResponse:
      type: object
      required: [detail, expires_in, resend_available_in]
      properties:
        detail:
          type: string
          enum: [otp_sent]
          example: otp_sent
        expires_in:
          type: integer
          description: OTP validity window in seconds (configured via OTP_TTL_SECONDS)
          example: 300
        resend_available_in:
          type: integer
          description: Seconds before the same phone number may request another OTP
          example: 30

    User:
      type: object
      required: [id, phone_number, date_joined]
      properties:
        id:
          type: integer
          description: Internal user primary key
          example: 42
        phone_number:
          type: string
          description: Verified phone number in E.164 format
          example: "+12125551234"
        date_joined:
          type: string
          format: date-time
          example: "2026-09-15T06:09:00Z"

    OtpVerifyResponse:
      type: object
      required: [access, refresh, is_new_user, user]
      properties:
        access:
          type: string
          description: Short-lived JWT access token (use as Bearer credential)
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIn0.sig"
        refresh:
          type: string
          description: Long-lived JWT refresh token (store securely; used at /token/refresh/ and /logout/)
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoicmVmcmVzaCJ9.sig"
        is_new_user:
          type: boolean
          description: True when the user account was created for the first time in this call
          example: false
        user:
          $ref: '#/components/schemas/User'

    TokenRefreshResponse:
      type: object
      required: [access]
      properties:
        access:
          type: string
          description: New JWT access token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIn0.new_sig"

    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: spot-rides-api

  # -------------------------------------------------------------------------
  # Reusable responses
  # -------------------------------------------------------------------------
  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: not_authenticated
            detail: Authentication credentials were not provided.

    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the caller may retry
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: rate_limited
            detail: Too many requests. Try again later.
            retry_after: 30

# ---------------------------------------------------------------------------
# Endpoints
# ---------------------------------------------------------------------------
paths:

  # -- Health -----------------------------------------------------------------
  /api/health/:
    get:
      summary: Health check
      description: Returns `200 OK` if the API process is alive.
      operationId: health_check
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: spot-rides-api

  # -- OTP request ------------------------------------------------------------
  /api/auth/otp/request/:
    post:
      summary: Send OTP via SMS
      description: |
        Validates and normalises `phone_number` to E.164, enforces rate limits,
        then dispatches a 6-digit OTP via Twilio SMS.

        **Rate limits**
        | Scope | Window | Limit |
        |-------|--------|-------|
        | Per phone | 30 s | 1 |
        | Per phone | 1 h | 5 |
        | Per phone | 24 h | 10 |
        | Per IP | 1 h | 20 |

        On any server-side error the rate-limit counters are compensated so the
        caller is not penalised for a provider failure.
      operationId: otp_request
      tags: [OTP Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestBody'
            examples:
              national_format:
                summary: US national format
                value:
                  phone_number: "(212) 555-1234"
              e164_format:
                summary: E.164 format
                value:
                  phone_number: "+12125551234"
      responses:
        '200':
          description: OTP dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
              example:
                detail: otp_sent
                expires_in: 300
                resend_available_in: 30
        '400':
          description: Invalid or unsupported phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalid_phone_number:
                  summary: Unparseable phone number
                  value:
                    error: invalid_phone_number
                    detail: Phone number is not a valid E.164 number.
                country_not_allowed:
                  summary: Country not on allowlist
                  value:
                    error: country_not_allowed
                    detail: Phone numbers from this country are not supported yet.
                invalid_request:
                  summary: Missing or blank field
                  value:
                    error: invalid_request
                    detail: This field may not be blank.
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: Twilio / SMS provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: sms_dispatch_failed
                detail: Unable to send SMS at this time. Try again shortly.
        '503':
          description: Auth service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: auth_unavailable
                detail: Authentication service is temporarily unavailable.

  # -- OTP verify -------------------------------------------------------------
  /api/auth/otp/verify/:
    post:
      summary: Verify OTP and receive JWT tokens
      description: |
        Validates the 6-digit code against the active OTP for the given phone
        number. On success:
        - Creates the user account if it doesn't exist yet.
        - Returns JWT `access` + `refresh` tokens with a `phone_number` custom claim.
        - Sets `last_login` on the user.

        **Rate limit**: 10 verify attempts per IP per hour.
      operationId: otp_verify
      tags: [OTP Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyBody'
            example:
              phone_number: "+12125551234"
              code: "123456"
      responses:
        '200':
          description: OTP verified — JWT token pair returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
              example:
                access: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIn0.sig"
                refresh: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoicmVmcmVzaCJ9.sig"
                is_new_user: false
                user:
                  id: 42
                  phone_number: "+12125551234"
                  date_joined: "2026-09-15T06:09:00Z"
        '400':
          description: Invalid code, expired OTP, or bad request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalid_code:
                  summary: Wrong OTP digits
                  value:
                    error: invalid_code
                    detail: The code you entered is incorrect.
                code_expired:
                  summary: OTP TTL elapsed
                  value:
                    error: code_expired
                    detail: OTP has expired. Request a new one.
                code_invalidated:
                  summary: OTP superseded by a newer request
                  value:
                    error: code_invalidated
                    detail: OTP has been invalidated.
                no_active_otp:
                  summary: No OTP was ever requested for this number
                  value:
                    error: no_active_otp
                    detail: No active OTP for this phone number.
                invalid_request:
                  summary: Malformed payload (e.g. code not 6 digits)
                  value:
                    error: invalid_request
                    detail: Code must be exactly 6 digits.
        '429':
          description: Rate limit or too many failed attempts
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                rate_limited:
                  summary: IP verify rate limit
                  value:
                    error: rate_limited
                    detail: Too many requests. Try again later.
                    retry_after: 3600
                too_many_attempts:
                  summary: Failed-attempt threshold reached
                  value:
                    error: too_many_attempts
                    detail: Too many failed attempts. Request a new OTP.

  # -- Token refresh ----------------------------------------------------------
  /api/auth/token/refresh/:
    post:
      summary: Refresh JWT access token
      description: |
        Standard SimpleJWT refresh endpoint. Exchange a non-blacklisted refresh
        token for a new short-lived access token. The refresh token is **not**
        rotated by this call.
      operationId: token_refresh
      tags: [JWT Tokens]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshBody'
            example:
              refresh: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoicmVmcmVzaCJ9.sig"
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
              example:
                access: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIn0.new_sig"
        '401':
          description: Refresh token invalid, expired, or blacklisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: not_authenticated
                detail: Token is invalid or expired.

  # -- Logout -----------------------------------------------------------------
  /api/auth/logout/:
    post:
      summary: Logout — blacklist refresh token
      description: |
        Blacklists the supplied refresh token, making it unusable for future
        `/token/refresh/` calls.

        **Requires** `Authorization: Bearer <access_token>` header.
        Returns `205 Reset Content` with an empty body on success.
      operationId: logout
      tags: [JWT Tokens]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutBody'
            example:
              refresh: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoicmVmcmVzaCJ9.sig"
      responses:
        '205':
          description: Logged out — refresh token blacklisted (empty body)
        '400':
          description: Refresh token already blacklisted or structurally invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: invalid_refresh
                detail: Refresh token is invalid or already blacklisted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  # -- Me ---------------------------------------------------------------------
  /api/auth/me/:
    get:
      summary: Get current user profile
      description: |
        Returns the minimal profile for the authenticated user.

        **Requires** `Authorization: Bearer <access_token>` header.
      operationId: me
      tags: [User]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 42
                phone_number: "+12125551234"
                date_joined: "2026-09-15T06:09:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
