  # -- DL submission ----------------------------------------------------------
  /api/onboarding/driver/dl/:
    post:
      summary: Submit driving licence for verification
      description: |
        Submit an Indian driving licence number for verification.
        Only accessible to users with active_role = driver.

        **DL format**: XX00 0000 0000000 (2-letter state code, 13 digits)
        Spaces/hyphens are optional and normalized server-side.

        **Verification modes**:
        - **Sync verified** (200): DL verified immediately, onboarding complete
        - **Async pending** (202): Verification in progress, poll /api/onboarding/driver/dl/status/

        **Attempt limit**: 3 submissions before manual review required.
      operationId: dl_submit
      tags: [Driver Verification]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DLSubmissionRequest'
            example:
              dl_number: "MH01 20110012345"
      responses:
        '200':
          description: DL verified synchronously
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/DLSubmissionResponse'
              example:
                success: true
                message: Driving licence verified successfully.
                data:
                  dl_verification_status: verified
                  onboarding_status: awaiting_vehicle
                  next_step: vehicle_registration
                  reference_id: mock-a1b2c3d4
                error: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-09-23T10:00:00Z"
        '202':
          description: DL verification pending (async)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/DLSubmissionResponse'
              example:
                success: true
                message: Driving licence verification in progress.
                data:
                  dl_verification_status: pending
                  onboarding_status: pending_verification
                  next_step: awaiting_verification
                  reference_id: provider-ref-xyz789
                error: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-09-23T10:00:00Z"
        '400':
          description: Invalid DL format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Invalid DL format. Expected XX00 0000 0000000.
                data: null
                error:
                  code: invalid_dl_format
                  detail: Invalid DL format. Expected XX00 0000 0000000.
                  fields: null
                  retry_after: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-09-23T10:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Only drivers can submit a driving licence.
                data: null
                error:
                  code: not_a_driver
                  detail: Only drivers can submit a driving licence.
                  fields: null
                  retry_after: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-09-23T10:00:00Z"
        '409':
          description: DL already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Driving licence already verified.
                data: null
                error:
                  code: dl_already_verified
                  detail: Driving licence already verified.
                  fields: null
                  retry_after: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-09-23T10:00:00Z"
        '422':
          description: DL verification provider error (the provider call failed, returned an invalid result, or the DL adapter is misconfigured). No attempt is consumed and nothing is persisted; a provider timeout is not an error (it yields `202` pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: DL verification service unavailable. Try again shortly.
                data: null
                error:
                  code: dl_verification_provider_error
                  detail: DL verification service unavailable. Try again shortly.
                  fields: null
                  retry_after: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-09-23T10:00:00Z"
        '429':
          description: Maximum DL submission attempts exceeded (`DL_MAX_ATTEMPTS`, default 3). The count is enforced under a row lock, so parallel submissions cannot exceed it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Maximum DL submission attempts exceeded. Contact support.
                data: null
                error:
                  code: max_dl_attempts_exceeded
                  detail: Maximum DL submission attempts exceeded. Contact support.
                  fields: null
                  retry_after: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-09-23T10:00:00Z"

