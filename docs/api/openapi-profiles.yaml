  /api/onboarding/driver/vehicle/status/:
    get:
      summary: Get vehicle RC verification status
      description: |
        Poll the driver's vehicle / RC verification state. Requires `active_role = driver`.
        **Not blocked by the onboarding gate**, so a driver in `pending_rc_verification` can poll.

        Owner name and other RC owner data are never returned. `rejection_reason` is sanitised and only
        set when `rc_verification_status = rejected`.

        With the flag off, `rc_verification_status` and `rc_attempts_remaining` are `null`.
        When the driver has no vehicle yet, `registration_number` and `vehicle_type` are `null`.
      operationId: vehicle_status
      tags: [Driver Verification]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current vehicle / RC verification status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/VehicleStatusResponse'
              examples:
                pending:
                  summary: Flag on, verification pending
                  value:
                    success: true
                    message: null
                    data:
                      onboarding_status: pending_rc_verification
                      next_step: awaiting_rc_verification
                      rc_verification_status: pending
                      rejection_reason: null
                      registration_number: MH01AB1234
                      vehicle_type: SEDAN
                      rc_attempts_remaining: 2
                    error: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-15T10:00:00Z"
                flag_off_no_vehicle:
                  summary: Flag off, no vehicle yet
                  value:
                    success: true
                    message: null
                    data:
                      onboarding_status: awaiting_vehicle
                      next_step: vehicle_registration
                      rc_verification_status: null
                      rejection_reason: null
                      registration_number: null
                      vehicle_type: null
                      rc_attempts_remaining: null
                    error: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-15T10:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: This endpoint is only accessible to drivers.
                data: null
                error:
                  code: not_a_driver
                  detail: This endpoint is only accessible to drivers.
                  fields: null
                  retry_after: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-10-15T10:00:00Z"

  # -- RC webhook (async verification callback) --------------------------------
  /api/onboarding/driver/vehicle/rc/webhook/:
    post:
      summary: RC verification webhook callback
      description: |
        Receives an asynchronous RC verification result (for example for a vehicle left in
        `pending_rc_verification`).

        **Not authenticated via JWT.** Calls are authenticated by the `X-RC-Signature` header: the
        lowercase hex HMAC-SHA256 of the raw request body keyed with `RC_WEBHOOK_SECRET`, optionally
        prefixed with `sha256=`. The signature is verified before the payload is parsed and before any
        database access.

        **Flag off**: always `404` (nothing is read or changed).

        **Outcomes** (flag on): `verified` moves the driver to `complete`; `rejected` moves a
        `pending_rc_verification` driver back to `awaiting_vehicle`. A verified result may still leave the
        vehicle pending (for example when the owner name needs review). The call is idempotent: a result
        for a vehicle that is already verified or rejected returns `409 already_processed`.
        The provider should retry on any non-`200`.
      operationId: rc_webhook
      tags: [Driver Verification]
      security:
        - RCWebhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RCWebhookRequest'
            example:
              reference_id: mock-rc-1a2b3c4d
              status: verified
              rejection_reason: null
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/WebhookProcessedResponse'
              example:
                success: true
                message: null
                data:
                  detail: Webhook processed successfully.
                error: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-10-15T10:00:00Z"
        '400':
          description: Malformed payload (invalid JSON, missing or invalid `reference_id` / `status`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Webhook payload is invalid.
                data: null
                error:
                  code: invalid_webhook_payload
                  detail: Webhook payload is invalid.
                  fields: null
                  retry_after: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-10-15T10:00:00Z"
        '403':
          description: Missing or invalid webhook signature (no state change)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Webhook signature validation failed.
                data: null
                error:
                  code: invalid_webhook_signature
                  detail: Webhook signature validation failed.
                  fields: null
                  retry_after: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-10-15T10:00:00Z"
        '404':
          description: |
            Either the RC verification flag is off (`not_found`, returned for every request), or the
            `reference_id` is unknown (`rc_reference_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                flag_off:
                  summary: Flag off
                  value:
                    success: false
                    message: Not found.
                    data: null
                    error:
                      code: not_found
                      detail: Not found.
                      fields: null
                      retry_after: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-15T10:00:00Z"
                unknown_reference:
                  summary: Unknown reference_id
                  value:
                    success: false
                    message: RC verification reference not found.
                    data: null
                    error:
                      code: rc_reference_not_found
                      detail: RC verification reference not found.
                      fields: null
                      retry_after: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-15T10:00:00Z"
        '409':
          description: Result already processed (idempotent re-delivery)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: This webhook result has already been processed.
                data: null
                error:
                  code: already_processed
                  detail: This webhook result has already been processed.
                  fields: null
                  retry_after: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-10-15T10:00:00Z"

  # -- Role switching ---------------------------------------------------------
  /api/profile/role/:
    patch:
      summary: Switch active role
      description: |
        Switch the active role between driver and passenger. This is also how a passenger becomes a
        driver: switching to driver without a verified DL starts driver setup.

        **Eligibility** (both flag modes): `onboarding_status` must be one of `complete`, `awaiting_dl`,
        `pending_verification`, `awaiting_vehicle`, `pending_rc_verification`. Users who have not finished
        role selection and profile details (`not_started`, `role_selected`) receive
        `403 onboarding_incomplete` (with `onboarding_status` and `next_step` in `error`).

        **Switching to passenger** (always possible, both flag modes): immediate. From any eligible state
        the result is `onboarding_status = complete`, `active_role = passenger`. Existing
        `DriverVerification` and `Vehicle` rows are kept, so nobody is locked out of the app mid driver setup.

        **Switching to driver** (a request for the role the user already has is a no-op):
        - DL **verified**: the status is derived from the vehicle so `complete` is never reached without a
          vehicle.
          - An active vehicle exists, or the user is grandfathered (`vehicle_step_exempt`) -> `complete`.
            With `RC_VERIFICATION_ENABLED` on the vehicle's RC status decides: verified or legacy (no RC
            status) -> `complete`; pending -> `pending_rc_verification`; rejected -> `awaiting_vehicle`.
            With the flag off an active vehicle always gives `complete`.
          - No active vehicle and not grandfathered -> `awaiting_vehicle`, `next_step = vehicle_registration`.
        - DL **pending**: `pending_verification` (HTTP 202), unchanged.
        - **No DL submitted, or DL rejected**: driver setup starts. `active_role = driver`,
          `onboarding_status = awaiting_dl`, `next_step = dl_submission` (HTTP 200). The user then follows
          the normal flow: `POST /api/onboarding/driver/dl/`, then vehicle registration. The DL attempt
          limit still applies to resubmission after a rejection.
        - A user in `awaiting_vehicle` whose `active_role` is not yet `driver` (inconsistent legacy data
          only) cannot switch to driver: with the flag on this returns `400 invalid_onboarding_state`; with
          the flag off it returns `403 onboarding_incomplete`. Switching such a user to passenger
          completes them, after which the switch to driver is derived as above.

        Only `pending_verification` returns HTTP 202. The former `400 dl_required` response is no longer
        returned by this endpoint.
      operationId: role_switch
      tags: [Profile]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleSwitchRequest'
            example:
              role: driver
      responses:
        '200':
          description: Role switched successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/RoleSwitchResponse'
              examples:
                driver_setup_started:
                  summary: Passenger with no DL (or a rejected DL) switched to driver; driver setup starts
                  value:
                    success: true
                    message: Role switched successfully.
                    data:
                      active_role: driver
                      onboarding_status: awaiting_dl
                      dl_verification_status: null
                      next_step: dl_submission
                    error: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-17T10:00:00Z"
                complete:
                  summary: Switched to driver (verified DL and an active vehicle), onboarding complete
                  value:
                    success: true
                    message: Role switched successfully.
                    data:
                      active_role: driver
                      onboarding_status: complete
                      dl_verification_status: verified
                      next_step: none
                    error: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-09-23T10:00:00Z"
                pending_rc_verification:
                  summary: (flag on) Switched to driver, vehicle RC verification pending
                  value:
                    success: true
                    message: Role switched successfully.
                    data:
                      active_role: driver
                      onboarding_status: pending_rc_verification
                      dl_verification_status: verified
                      next_step: awaiting_rc_verification
                    error: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-15T10:00:00Z"
                awaiting_vehicle:
                  summary: Switched to driver; no active vehicle (either flag mode) or previous vehicle was rejected (flag on)
                  value:
                    success: true
                    message: Role switched successfully.
                    data:
                      active_role: driver
                      onboarding_status: awaiting_vehicle
                      dl_verification_status: verified
                      next_step: vehicle_registration
                    error: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-15T10:00:00Z"
                passenger_from_awaiting_states:
                  summary: awaiting_dl, awaiting_vehicle, pending_verification or pending_rc_verification user switched to passenger (both flag modes)
                  value:
                    success: true
                    message: Role switched successfully.
                    data:
                      active_role: passenger
                      onboarding_status: complete
                      dl_verification_status: verified
                      next_step: none
                    error: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-15T10:00:00Z"
        '202':
          description: Role switched to driver but DL is pending
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/RoleSwitchResponse'
              example:
                success: true
                message: Role switched successfully.
                data:
                  active_role: driver
                  onboarding_status: pending_verification
                  dl_verification_status: pending
                  next_step: awaiting_verification
                error: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-09-23T10:00:00Z"
        '400':
          description: |
            `invalid_role` - `role` is not `driver` or `passenger` (a missing or null `role` returns the
            generic `invalid_request`).
            `invalid_onboarding_state` - (flag on) a user in `awaiting_vehicle` whose `active_role` is not
            `driver` (inconsistent legacy data) switching to driver; no state changes.
            A user whose onboarding is not far enough along receives `403 onboarding_incomplete` instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalid_role:
                  summary: Unsupported role value
                  value:
                    success: false
                    message: Role must be "driver" or "passenger".
                    data: null
                    error:
                      code: invalid_role
                      detail: Role must be "driver" or "passenger".
                      fields:
                        role: ['"admin" is not a valid choice.']
                      retry_after: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-17T10:00:00Z"
                invalid_onboarding_state:
                  summary: (flag on) awaiting_vehicle user whose active_role is not driver cannot switch to driver
                  value:
                    success: false
                    message: Finish vehicle registration first, or switch to passenger.
                    data: null
                    error:
                      code: invalid_onboarding_state
                      detail: Finish vehicle registration first, or switch to passenger.
                      fields: null
                      retry_after: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-15T10:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            `onboarding_incomplete` - the user has not finished role selection and profile details
            (`not_started` or `role_selected`), so they are not eligible for a role switch. (Also returned,
            with the flag off, for an `awaiting_vehicle` user whose `active_role` is not `driver` switching
            to driver; inconsistent legacy data only.) The `error` object carries the user's current
            `onboarding_status` and `next_step`, in the same shape the onboarding gate returns; a user
            with no profile yet is reported as `not_started` / `role_selection`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        $ref: '#/components/schemas/OnboardingGateErrorDetail'
              example:
                success: false
                message: Onboarding must be completed before accessing this endpoint.
                data: null
                error:
                  code: onboarding_incomplete
                  detail: Onboarding must be completed before accessing this endpoint.
                  fields: null
                  retry_after: null
                  onboarding_status: role_selected
                  next_step: profile
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-10-17T10:00:00Z"
