openapi: 3.0.3
info:
  title: Spot Rides — Onboarding API (profiles)
  description: |
    User onboarding flow endpoints for the Spot Rides platform.

    ## Onboarding flow

    After completing OTP authentication (FEAT-001), new users must complete onboarding:

    1. `GET /api/onboarding/status/` — check current onboarding state and next required step
    2. `POST /api/onboarding/role/` — select active role: `driver` or `passenger`
    3. `POST /api/onboarding/profile/` — submit personal details (first name, last name, age, gender)
    4. **For drivers only**: `POST /api/onboarding/driver/dl/` — submit Indian driving licence number for verification
    5. **For drivers in pending state**: `GET /api/onboarding/driver/dl/status/` — poll for DL verification result
    6. **For drivers after DL verified**: `POST /api/onboarding/driver/vehicle/` — register vehicle (registration number + type)
    7. **For drivers with vehicle RC verification enabled** (`RC_VERIFICATION_ENABLED`, default: false):
       - the vehicle submission may return `202` with `onboarding_status = pending_rc_verification` and
         `next_step = awaiting_rc_verification`; poll `GET /api/onboarding/driver/vehicle/status/`
         until the vehicle is verified (`complete`) or rejected (`awaiting_vehicle`, resubmit)
       - an asynchronous provider result arrives at `POST /api/onboarding/driver/vehicle/rc/webhook/`
         (signature-authenticated, not JWT)

    ### Vehicle RC verification feature flag

    `RC_VERIFICATION_ENABLED` defaults to `false`. Only a mock adapter exists; no real provider is integrated.
    - **Flag off**: `POST /api/onboarding/driver/vehicle/` registers the self-declared vehicle and returns
      `200` / `complete`. The additive fields `rc_verification_status`, `rejection_reason` and
      `reference_id` are `null`. The RC webhook returns `404`, and the status endpoint returns `null` RC fields.
    - **Flag on**: the submission is verified; outcomes are `200` complete, `202` pending, or an error
      (`422 rc_verification_rejected`, `422 rc_verification_provider_error`, `429 max_rc_attempts_exceeded`,
      `409 rc_verification_pending`, `409 rc_already_verified`). Those flag-on codes are marked in the endpoint docs.

    ### Role switching (post-onboarding)

    Users can switch between driver and passenger roles at any time:
    - `PATCH /api/profile/role/` — switch active role
    - Switching to passenger: always immediate
    - Switching to driver: requires verified DL
    - With the RC flag on, a driver whose vehicle is `pending_rc_verification` or still `awaiting_vehicle`
      may also switch to passenger (which completes onboarding), and switching back to driver restores the
      status derived from the vehicle (`complete`, `pending_rc_verification` or `awaiting_vehicle`)

    ### Onboarding gate

    All endpoints (except auth, onboarding, and webhook endpoints) require `onboarding_status = complete`.
    This gate is controlled by the `ONBOARDING_GATE_ENABLED` feature flag (default: false).
    When it blocks a request the response is `403 onboarding_incomplete`, whose `error` object also carries
    `onboarding_status` and `next_step`. A driver in `pending_rc_verification` is gated like one in
    `pending_verification`; the vehicle status endpoint is not gated so such a driver can poll.

    ## Response envelope

    Every response uses the unified envelope:
    ```json
    {
      "success": true,
      "message": "Role selected successfully.",
      "data": { },
      "error": null,
      "meta": { "request_id": "…", "timestamp": "…" }
    }
    ```

  version: 2.1.0
  contact:
    name: Spot Rides Engineering

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.spotrides.com
    description: Production

tags:
  - name: Onboarding
    description: New user onboarding flow (role selection, profile, DL verification)
  - name: Driver Verification
    description: Driving licence and vehicle (RC) verification for drivers
  - name: Profile
    description: User profile management and role switching

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from OTP authentication
    RCWebhookSignature:
      type: apiKey
      in: header
      name: X-RC-Signature
      description: |
        Authenticates RC verification webhook calls (no JWT). The value is the lowercase hex
        HMAC-SHA256 of the **raw request body** keyed with the shared `RC_WEBHOOK_SECRET`,
        optionally prefixed with `sha256=`. The signature is verified before the body is parsed
        or the database is touched; a missing, empty or incorrect signature (or an unset
        secret) is rejected with `403 invalid_webhook_signature`.
    DLWebhookSignature:
      type: apiKey
      in: header
      name: X-DL-Signature
      description: |
        Authenticates DL verification webhook calls (no JWT). The value is the lowercase hex
        HMAC-SHA256 of the **raw request body** keyed with the shared `DL_WEBHOOK_SECRET`,
        optionally prefixed with `sha256=`. The comparison is constant-time. The signature is
        verified before the body is parsed or the database is touched; a missing, empty or
        incorrect signature (or an unset secret: the endpoint fails closed) is rejected with
        `403 invalid_webhook_signature`. The former static `X-Mock-Signature: mock-secret` header
        is no longer accepted.

  # -------------------------------------------------------------------------
  # Reusable schemas
  # -------------------------------------------------------------------------
  schemas:

    # -- Shared response envelope ---------------------------------------------
    ResponseMeta:
      type: object
      required: [request_id, timestamp]
      properties:
        request_id:
          type: string
          nullable: true
          example: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
        timestamp:
          type: string
          format: date-time
          example: "2026-09-23T10:00:00Z"

    SuccessEnvelope:
      type: object
      required: [success, message, data, error, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
          nullable: true
        data:
          nullable: true
        error:
          nullable: true
          enum: [null]
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ErrorEnvelope:
      type: object
      required: [success, message, data, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        data:
          nullable: true
          enum: [null]
        error:
          $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ErrorDetail:
      type: object
      required: [code, detail]
      description: |
        Error payload. `code`, `detail`, `fields` and `retry_after` are reserved keys that are
        always present (`fields` / `retry_after` are `null` when not applicable) and can never be
        overridden. Individual errors may carry **additional flat keys** next to them
        (for example `onboarding_status` and `next_step` on `403 onboarding_incomplete`, and
        `onboarding_status`, `next_step`, `rc_verification_status`, `rc_attempts_remaining` on
        `422 rc_verification_rejected`). Clients must ignore keys they do not recognise.
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: invalid_age
        detail:
          type: string
          description: Human-readable error message
          example: Age must be between 18 and 80
        fields:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
        retry_after:
          type: integer
          nullable: true
      additionalProperties: true

    OnboardingGateErrorDetail:
      description: |
        `error` object for `403 onboarding_incomplete`. Carries the user's current state so the
        client can route to the next onboarding screen without a second call.
      allOf:
        - $ref: '#/components/schemas/ErrorDetail'
        - type: object
          required: [onboarding_status, next_step]
          properties:
            onboarding_status:
              $ref: '#/components/schemas/OnboardingStatus'
            next_step:
              $ref: '#/components/schemas/NextStep'

    RCRejectedErrorDetail:
      description: |
        `error` object for `422 rc_verification_rejected` (flag on only). `detail` is a sanitised
        rejection reason. The driver stays in `awaiting_vehicle` and may resubmit.
      allOf:
        - $ref: '#/components/schemas/ErrorDetail'
        - type: object
          required: [onboarding_status, next_step, rc_verification_status, rc_attempts_remaining]
          properties:
            onboarding_status:
              $ref: '#/components/schemas/OnboardingStatus'
            next_step:
              $ref: '#/components/schemas/NextStep'
            rc_verification_status:
              type: string
              enum: [rejected]
              example: rejected
            rc_attempts_remaining:
              type: integer
              minimum: 0
              description: Submissions left before `429 max_rc_attempts_exceeded`
              example: 2

    # -- Shared enums ---------------------------------------------------------
    OnboardingStatus:
      type: string
      description: |
        Onboarding state (lowercase values, as returned by the API).
        `pending_rc_verification` is only reachable while `RC_VERIFICATION_ENABLED` is on
        (or for drivers already in that state if the flag is later turned off).
      enum:
        - not_started
        - role_selected
        - awaiting_dl
        - pending_verification
        - awaiting_vehicle
        - pending_rc_verification
        - complete
      example: role_selected

    NextStep:
      type: string
      description: Next required client step. `awaiting_rc_verification` is flag-on only.
      enum:
        - role_selection
        - profile
        - dl_submission
        - awaiting_verification
        - vehicle_registration
        - awaiting_rc_verification
        - none
      example: profile

    RCVerificationStatus:
      type: string
      nullable: true
      description: |
        Vehicle RC verification status. `null` when the flag is off, when no vehicle exists,
        or for a legacy self-declared vehicle.
      enum: [pending, verified, rejected, null]
      example: pending

    # -- Onboarding -----------------------------------------------------------
    OnboardingStatusResponse:
      type: object
      required: [onboarding_status, active_role, next_step, profile_complete, dl_verification_status, rc_verification_status]
      properties:
        onboarding_status:
          $ref: '#/components/schemas/OnboardingStatus'
        active_role:
          type: string
          nullable: true
          enum: [driver, passenger, null]
          example: passenger
        next_step:
          $ref: '#/components/schemas/NextStep'
        profile_complete:
          type: boolean
          description: Whether first_name/last_name/age/gender have been set
          example: false
        dl_verification_status:
          type: string
          nullable: true
          enum: [pending, verified, rejected, null]
          example: null
        rc_verification_status:
          allOf:
            - $ref: '#/components/schemas/RCVerificationStatus'
          description: |
            Vehicle RC verification status of the newest active vehicle (additive field).
            Always `null` while `RC_VERIFICATION_ENABLED` is off.

    RoleSelectionRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [driver, passenger]
          description: Active role to set (lowercase in request)
          example: passenger

    RoleSelectionResponse:
      type: object
      required: [active_role, onboarding_status, next_step]
      properties:
        active_role:
          type: string
          enum: [driver, passenger]
          example: passenger
        onboarding_status:
          type: string
          enum: [role_selected]
          example: role_selected
        next_step:
          type: string
          enum: [profile]
          example: profile

    ProfileDetailsRequest:
      type: object
      required: [first_name, last_name, age, gender]
      properties:
        first_name:
          type: string
          maxLength: 50
          pattern: "^[\\w\\s'-]+$"
          example: Priya
        last_name:
          type: string
          maxLength: 50
          pattern: "^[\\w\\s'-]+$"
          example: Sharma
        age:
          type: integer
          minimum: 18
          maximum: 80
          example: 27
        gender:
          type: string
          enum: [male, female, other, prefer_not_to_say]
          example: female

    ProfileDetailsResponse:
      type: object
      required: [onboarding_status, next_step]
      properties:
        onboarding_status:
          type: string
          enum: [complete, awaiting_dl]
          description: complete for passengers, awaiting_dl for drivers
          example: complete
        next_step:
          type: string
          enum: [none, dl_submission]
          example: none

    DLSubmissionRequest:
      type: object
      required: [dl_number]
      properties:
        dl_number:
          type: string
          maxLength: 20
          pattern: "^[A-Z]{2}[0-9]{2}[ -]?[0-9]{4}[0-9]{7}$"
          description: |
            Indian driving licence number. Format: XX00 0000 0000000
            (2 state letters, 2-digit RTO code, 4-digit year, 7-digit serial).
            Spaces/hyphens optional; normalized to uppercase internally.
          example: "MH01 20110012345"

    DLSubmissionResponse:
      type: object
      required: [dl_verification_status, onboarding_status, next_step]
      properties:
        dl_verification_status:
          type: string
          enum: [verified, pending]
          example: verified
        onboarding_status:
          type: string
          enum: [awaiting_vehicle, pending_verification]
          example: awaiting_vehicle
        next_step:
          type: string
          enum: [vehicle_registration, awaiting_verification]
          example: vehicle_registration
        reference_id:
          type: string
          nullable: true
          description: Provider reference ID for async verification
          example: mock-a1b2c3d4

    DLStatusResponse:
      type: object
      required: [dl_verification_status, onboarding_status, rejection_reason, dl_number_display]
      properties:
        dl_verification_status:
          type: string
          enum: [pending, verified, rejected]
          example: verified
        onboarding_status:
          $ref: '#/components/schemas/OnboardingStatus'
        rejection_reason:
          type: string
          nullable: true
          description: Reason if rejected
          example: null
        dl_number_display:
          type: string
          description: Last 4 digits of DL number
          example: "2345"

    RoleSwitchRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [driver, passenger]
          example: driver

    RoleSwitchResponse:
      type: object
      required: [active_role, onboarding_status, dl_verification_status, next_step]
      properties:
        active_role:
          type: string
          enum: [driver, passenger]
          example: driver
        onboarding_status:
          type: string
          enum: [complete, awaiting_dl, pending_verification, awaiting_vehicle, pending_rc_verification]
          description: |
            `awaiting_dl` is returned when a user with no verified or pending DL switches to driver
            (driver setup starts). `awaiting_vehicle` is returned when a user with a verified DL and no
            active vehicle (and not grandfathered) switches to driver, in either flag mode.
            `pending_rc_verification` is only returned while `RC_VERIFICATION_ENABLED` is on.
          example: complete
        dl_verification_status:
          type: string
          nullable: true
          enum: [verified, pending, rejected, null]
          description: '`null` when the user has never submitted a DL.'
          example: verified
        next_step:
          type: string
          enum: [none, dl_submission, awaiting_verification, vehicle_registration, awaiting_rc_verification]
          description: |
            The client's next onboarding step for the resulting `onboarding_status` (same mapping as
            `GET /api/onboarding/status/`). Always present. It was previously present only for
            `awaiting_vehicle` / `pending_rc_verification`; the field is additive.
          example: none

    VehicleRegistrationRequest:
      type: object
      required: [registration_number, vehicle_type]
      properties:
        registration_number:
          type: string
          maxLength: 15
          pattern: "^[A-Z]{2}[0-9]{2}[A-Z]{1,3}[0-9]{1,4}$"
          description: |
            Indian vehicle registration number. Format: XX00XXX0000
            (2-letter state code, 2-digit RTO code, 1-3 letter series, 1-4 digit number).
            Spaces/hyphens optional; normalized to uppercase internally.
          example: "MH01AB1234"
        vehicle_type:
          type: string
          enum: [car, suv, hatchback, sedan, auto_rickshaw, bike]
          description: Type of vehicle (lowercase in request)
          example: sedan

    VehicleRegistrationResponse:
      type: object
      required: [onboarding_status, next_step, vehicle, rc_verification_status, rejection_reason, reference_id]
      properties:
        onboarding_status:
          type: string
          enum: [complete, pending_rc_verification]
          description: |
            `complete` with the flag off, or with the flag on after a synchronous pass.
            `pending_rc_verification` (flag on only) when verification is pending, timed out,
            or flagged for admin review (HTTP 202).
          example: complete
        next_step:
          type: string
          enum: [none, awaiting_rc_verification]
          example: none
        vehicle:
          type: object
          required: [registration_number, vehicle_type]
          properties:
            registration_number:
              type: string
              example: "MH01AB1234"
            vehicle_type:
              type: string
              description: Uppercase in responses (lowercase in the request)
              enum: [CAR, SUV, HATCHBACK, SEDAN, AUTO_RICKSHAW, BIKE]
              example: SEDAN
        rc_verification_status:
          allOf:
            - $ref: '#/components/schemas/RCVerificationStatus'
          description: |
            Additive. `null` with the flag off; `verified` or `pending` with the flag on
            (a rejection is returned as `422 rc_verification_rejected`, not in this body).
        rejection_reason:
          type: string
          nullable: true
          description: Additive. Always `null` on success responses.
          example: null
        reference_id:
          type: string
          nullable: true
          description: |
            Additive. Verification reference; `null` with the flag off. With the flag on it is
            the provider reference when one was issued.
          example: null

    VehicleStatusResponse:
      type: object
      required:
        - onboarding_status
        - next_step
        - rc_verification_status
        - rejection_reason
        - registration_number
        - vehicle_type
        - rc_attempts_remaining
      properties:
        onboarding_status:
          $ref: '#/components/schemas/OnboardingStatus'
        next_step:
          $ref: '#/components/schemas/NextStep'
        rc_verification_status:
          allOf:
            - $ref: '#/components/schemas/RCVerificationStatus'
          description: '`null` when the flag is off or no vehicle exists.'
        rejection_reason:
          type: string
          nullable: true
          description: Sanitised reason; only set when `rc_verification_status` is `rejected`.
          example: null
        registration_number:
          type: string
          nullable: true
          description: Registration number of the newest active vehicle; `null` when none.
          example: "MH01AB1234"
        vehicle_type:
          type: string
          nullable: true
          description: Uppercase vehicle type; `null` when no vehicle exists.
          enum: [CAR, SUV, HATCHBACK, SEDAN, AUTO_RICKSHAW, BIKE, null]
          example: SEDAN
        rc_attempts_remaining:
          type: integer
          nullable: true
          description: Submissions left before `429 max_rc_attempts_exceeded`; `null` when the flag is off.
          example: 2

    WebhookRequest:
      type: object
      required: [reference_id, status]
      description: |
        Asynchronous DL verification result. Sent as JSON; the raw request body is what is signed
        (see the `DLWebhookSignature` security scheme).
      properties:
        reference_id:
          type: string
          description: Provider reference ID from DL submission
          example: mock-a1b2c3d4
        status:
          type: string
          enum: [verified, rejected]
          example: verified
        rejection_reason:
          type: string
          nullable: true
          description: Provider rejection reason (sanitised before it is stored or shown to the driver; a blank value is stored as null)
          example: null

    RCWebhookRequest:
      type: object
      required: [reference_id, status]
      description: |
        Asynchronous RC verification result. Sent as JSON; the raw request body is what is signed
        (see the `RCWebhookSignature` security scheme).
      properties:
        reference_id:
          type: string
          maxLength: 100
          description: Reference ID returned as `reference_id` when the vehicle was submitted
          example: mock-rc-1a2b3c4d
        status:
          type: string
          enum: [verified, rejected]
          example: verified
        rejection_reason:
          type: string
          nullable: true
          description: Provider rejection reason (sanitised before it is exposed to the driver)
          example: null

    WebhookProcessedResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          example: Webhook processed successfully.

  # -------------------------------------------------------------------------
  # Reusable responses
  # -------------------------------------------------------------------------
  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Authentication credentials were not provided.
            data: null
            error:
              code: not_authenticated
              detail: Authentication credentials were not provided.
              fields: null
              retry_after: null
            meta:
              request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
              timestamp: "2026-09-23T10:00:00Z"

    OnboardingIncomplete:
      description: |
        Onboarding not complete (only when `ONBOARDING_GATE_ENABLED` is on). The `error` object carries
        the user's current `onboarding_status` and `next_step`; a user with no profile yet is reported
        as `not_started` / `role_selection`.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    $ref: '#/components/schemas/OnboardingGateErrorDetail'
          example:
            success: false
            message: Onboarding must be completed before accessing this endpoint.
            data: null
            error:
              code: onboarding_incomplete
              detail: Onboarding must be completed before accessing this endpoint.
              fields: null
              retry_after: null
              onboarding_status: pending_rc_verification
              next_step: awaiting_rc_verification
            meta:
              request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
              timestamp: "2026-09-23T10:00:00Z"

# ---------------------------------------------------------------------------
# Endpoints
# ---------------------------------------------------------------------------
paths:

  # -- Onboarding status ------------------------------------------------------
  /api/onboarding/status/:
    get:
      summary: Get onboarding status
      description: |
        Returns the current onboarding state and the next required step.
        Accessible to all authenticated users regardless of onboarding status.

        `rc_verification_status` is additive: the RC status of the newest active vehicle
        (`pending`, `verified`, `rejected`), or `null` when the RC flag is off or there is no vehicle.
      operationId: onboarding_status
      tags: [Onboarding]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current onboarding state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/OnboardingStatusResponse'
              example:
                success: true
                message: null
                data:
                  onboarding_status: not_started
                  active_role: null
                  next_step: role_selection
                  profile_complete: false
                  dl_verification_status: null
                  rc_verification_status: null
                error: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-09-23T10:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'

  # -- Role selection ---------------------------------------------------------
  /api/onboarding/role/:
    post:
      summary: Select user role
      description: |
        Set the active role during onboarding. Must be called before profile submission.
        Can only be called once — subsequent calls return 409 Conflict.
      operationId: role_select
      tags: [Onboarding]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleSelectionRequest'
            example:
              role: passenger
      responses:
        '200':
          description: Role selected successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/RoleSelectionResponse'
              example:
                success: true
                message: Role selected successfully.
                data:
                  active_role: passenger
                  onboarding_status: role_selected
                  next_step: profile
                error: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-09-23T10:00:00Z"
        '400':
          description: |
            `invalid_role` - `role` is not `driver` or `passenger`. A missing or null `role` returns the
            generic `invalid_request`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Role must be "driver" or "passenger".
                data: null
                error:
                  code: invalid_role
                  detail: Role must be "driver" or "passenger".
                  fields:
                    role: ['"admin" is not a valid choice.']
                  retry_after: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-09-23T10:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Role already set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Role already set.
                data: null
                error:
                  code: role_already_set
                  detail: Role already set.
