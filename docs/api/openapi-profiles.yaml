  # -- DL webhook (async verification callback) -------------------------------
  /api/onboarding/driver/dl/webhook/:
    post:
      summary: DL verification webhook callback
      description: |
        Receives async verification results from the DL provider.

        **Not authenticated via JWT.** Calls are authenticated by the `X-DL-Signature` header: the
        lowercase hex HMAC-SHA256 of the raw request body keyed with `DL_WEBHOOK_SECRET`, optionally
        prefixed with `sha256=`. The signature is verified before the payload is parsed and before
        any database access; a missing, empty or incorrect signature, or an unset secret, returns
        `403 invalid_webhook_signature` and changes nothing.

        Delivery is idempotent: a result for a DL that is already `verified` or `rejected` is
        acknowledged with `200` and changes nothing (it is not an error). A `verified` result
        advances the driver from `pending_verification` to `awaiting_vehicle` only; a user who has
        since switched to passenger keeps their status. An unknown `reference_id` returns
        `404 dl_reference_not_found`.
      operationId: dl_webhook
      tags: [Driver Verification]
      security:
        - DLWebhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
            example:
              reference_id: provider-ref-xyz789
              status: verified
              rejection_reason: null
      responses:
        '200':
          description: Webhook processed successfully (also returned for an idempotent re-delivery of an already-resolved DL)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          detail:
                            type: string
                            example: Webhook processed successfully.
              example:
                success: true
                message: null
                data:
                  detail: Webhook processed successfully.
                error: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-09-23T10:00:00Z"
        '400':
          description: Malformed payload (only reachable with a valid signature)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing, empty or invalid `X-DL-Signature`, or no `DL_WEBHOOK_SECRET` configured (no state change, no database access)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Webhook signature validation failed.
                data: null
                error:
                  code: invalid_webhook_signature
                  detail: Webhook signature validation failed.
                  fields: null
                  retry_after: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-10-17T10:00:00Z"
        '404':
          description: Valid signature but unknown `reference_id` (`dl_reference_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: DL verification reference not found.
                data: null
                error:
                  code: dl_reference_not_found
                  detail: DL verification reference not found.
                  fields: null
                  retry_after: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-10-17T10:00:00Z"

  # -- Vehicle registration ----------------------------------------------------
  /api/onboarding/driver/vehicle/:
    post:
      summary: Register vehicle during driver onboarding
      description: |
        Register a vehicle (registration number and type) as the final step of driver onboarding.
        Only accessible to drivers (`active_role = driver`) with a verified DL and
        `onboarding_status = awaiting_vehicle`. Not blocked by the onboarding gate.

        **Vehicle registration format**: XX00XXX0000 (Indian format)
        - 2-letter state code, 2-digit RTO code, 1-3 letter series, 1-4 digit number
        - Spaces/hyphens optional; normalized server-side

        **v1 limit**: One vehicle per driver. Multiple vehicles planned for a future release.

        **Behaviour depends on `RC_VERIFICATION_ENABLED` (default: false)**

        - **Flag off** (launch behaviour): format validation and self-declaration only. The vehicle is
          created and the response is `200` with `onboarding_status = complete`, `next_step = none`.
          `rc_verification_status`, `rejection_reason` and `reference_id` are `null`.
        - **Flag on**: the registration number is checked by the RC verification adapter (only a mock
          adapter exists; there is no real provider).
          - `200` `complete` / `next_step = none` / `rc_verification_status = verified` - synchronous pass
          - `202` `pending_rc_verification` / `next_step = awaiting_rc_verification` /
            `rc_verification_status = pending` - provider pending, timed out, or flagged for review. The response
            does not reveal which. Poll `GET /api/onboarding/driver/vehicle/status/`.
          - `422 rc_verification_rejected` - the driver stays in `awaiting_vehicle` and may resubmit
            (the same vehicle row is reused) until the attempt limit is reached.

        Error codes marked **(flag on)** are never returned while the flag is off. The other error codes
        apply with the flag on or off.
      operationId: vehicle_register
      tags: [Driver Verification]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRegistrationRequest'
            example:
              registration_number: "MH01AB1234"
              vehicle_type: sedan
      responses:
        '200':
          description: Vehicle registered, onboarding complete (flag off, or flag on with a synchronous pass)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/VehicleRegistrationResponse'
              examples:
                flag_off:
                  summary: RC verification flag off (self-declared vehicle)
                  value:
                    success: true
                    message: Vehicle registered successfully. Onboarding complete.
                    data:
                      onboarding_status: complete
                      next_step: none
                      vehicle:
                        registration_number: MH01AB1234
                        vehicle_type: SEDAN
                      rc_verification_status: null
                      rejection_reason: null
                      reference_id: null
                    error: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-10T10:00:00Z"
                flag_on_verified:
                  summary: Flag on, verified synchronously
                  value:
                    success: true
                    message: Vehicle registered successfully. Onboarding complete.
                    data:
                      onboarding_status: complete
                      next_step: none
                      vehicle:
                        registration_number: MH01AB1234
                        vehicle_type: SEDAN
                      rc_verification_status: verified
                      rejection_reason: null
                      reference_id: mock-rc-1a2b3c4d
                    error: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-15T10:00:00Z"
        '202':
          description: |
            **(flag on)** Vehicle submitted; verification is pending, timed out, or flagged for review.
            `onboarding_status = pending_rc_verification`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/VehicleRegistrationResponse'
              example:
                success: true
                message: Vehicle submitted for verification.
                data:
                  onboarding_status: pending_rc_verification
                  next_step: awaiting_rc_verification
                  vehicle:
                    registration_number: MH01AB1234
                    vehicle_type: SEDAN
                  rc_verification_status: pending
                  rejection_reason: null
                  reference_id: mock-rc-1a2b3c4d
                error: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-10-15T10:00:00Z"
        '400':
          description: Invalid registration format or vehicle type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalid_format:
                  summary: Invalid registration number format
                  value:
                    success: false
                    message: "Invalid vehicle registration format. Expected: XX00XXX0000 (e.g. MH01AB1234)"
                    data: null
                    error:
                      code: invalid_registration_format
                      detail: "Invalid vehicle registration format. Expected: XX00XXX0000 (e.g. MH01AB1234)"
                      fields: null
                      retry_after: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-10T10:00:00Z"
                invalid_type:
                  summary: Invalid vehicle type
                  value:
                    success: false
                    message: "Vehicle type must be one of: car, suv, hatchback, sedan, auto_rickshaw, bike."
                    data: null
                    error:
                      code: invalid_vehicle_type
                      detail: "Vehicle type must be one of: car, suv, hatchback, sedan, auto_rickshaw, bike."
                      fields: null
                      retry_after: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-10T10:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a driver or DL not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                not_a_driver:
                  summary: User is not a driver (e.g. active role is passenger)
                  value:
                    success: false
                    message: This endpoint is only accessible to drivers.
                    data: null
                    error:
                      code: not_a_driver
                      detail: This endpoint is only accessible to drivers.
                      fields: null
                      retry_after: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-10T10:00:00Z"
                dl_not_verified:
                  summary: DL not yet verified (driver not in awaiting_vehicle)
                  value:
                    success: false
                    message: Driving licence must be verified before registering a vehicle.
                    data: null
                    error:
                      code: dl_not_verified
                      detail: Driving licence must be verified before registering a vehicle.
                      fields: null
                      retry_after: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-10T10:00:00Z"
        '409':
          description: |
            Conflict. `vehicle_already_registered` applies with the flag on or off (a driver whose
            onboarding is already `complete`, or who already has an active vehicle).
            `rc_verification_pending` and `rc_already_verified` are **flag on only**.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                vehicle_already_registered:
                  summary: Vehicle already registered
                  value:
                    success: false
                    message: A vehicle is already registered for this account.
                    data: null
                    error:
                      code: vehicle_already_registered
                      detail: A vehicle is already registered for this account.
                      fields: null
                      retry_after: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-10T10:00:00Z"
                rc_verification_pending:
                  summary: (flag on) A submission is already being verified
                  value:
                    success: false
                    message: Your vehicle is already being verified.
                    data: null
                    error:
                      code: rc_verification_pending
                      detail: Your vehicle is already being verified.
                      fields: null
                      retry_after: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-15T10:00:00Z"
                rc_already_verified:
                  summary: (flag on) The vehicle is already verified
                  value:
                    success: false
                    message: Your vehicle is already verified.
                    data: null
                    error:
                      code: rc_already_verified
                      detail: Your vehicle is already verified.
                      fields: null
                      retry_after: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-15T10:00:00Z"
        '422':
          description: |
            **(flag on only)** `rc_verification_rejected` - the RC was rejected (not found, blocked, or a
            clear vehicle-class conflict); the attempt is consumed and the driver stays in
            `awaiting_vehicle`. `rc_verification_provider_error` - the provider call failed with a
            non-timeout error; the attempt is not consumed and the client may retry.
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/ErrorEnvelope'
                      - type: object
                        properties:
                          error:
                            $ref: '#/components/schemas/RCRejectedErrorDetail'
                  - $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                rc_verification_rejected:
                  summary: RC rejected (extra flat keys inside error)
                  value:
                    success: false
                    message: Mock rejection for testing
                    data: null
                    error:
                      code: rc_verification_rejected
                      detail: Mock rejection for testing
                      fields: null
                      retry_after: null
                      onboarding_status: awaiting_vehicle
                      next_step: vehicle_registration
                      rc_verification_status: rejected
                      rc_attempts_remaining: 2
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-15T10:00:00Z"
                rc_verification_provider_error:
                  summary: Provider call failed (attempt not consumed)
                  value:
                    success: false
                    message: Vehicle verification is temporarily unavailable. Please try again.
                    data: null
                    error:
                      code: rc_verification_provider_error
                      detail: Vehicle verification is temporarily unavailable. Please try again.
                      fields: null
                      retry_after: null
                    meta:
                      request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                      timestamp: "2026-10-15T10:00:00Z"
        '429':
          description: "**(flag on only)** Maximum RC verification attempts reached (`RC_MAX_ATTEMPTS`, default 3); staff action required"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Maximum vehicle verification attempts exceeded. Please contact support.
                data: null
                error:
                  code: max_rc_attempts_exceeded
                  detail: Maximum vehicle verification attempts exceeded. Please contact support.
                  fields: null
                  retry_after: null
                meta:
                  request_id: 9f1c2b7e4a6d4f0f8b3c1d2e5a7b9c0d
                  timestamp: "2026-10-15T10:00:00Z"

